<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SphereCraft 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
#canvas-container { width: 100%; height: 100%; display: block; }
/* UI Overlays */
.ui-panel {
position: absolute;
background: rgba(15, 15, 20, 0.85);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 12px;
color: #fff;
padding: 16px;
pointer-events: none;
}
#hud {
top: 20px; left: 20px;
display: flex; flex-direction: column; gap: 6px;
font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
#crosshair {
position: absolute; top: 50%; left: 50%;
width: 10px; height: 10px; transform: translate(-50%, -50%);
pointer-events: none;
}
#crosshair::before, #crosshair::after {
content: ''; position: absolute; background: rgba(255,255,255,0.8);
box-shadow: 0 0 2px rgba(0,0,0,0.8);
}
#crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
#crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
/* Hotbar */
#hotbar-container {
position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
display: flex; gap: 8px; padding: 8px;
background: rgba(20, 20, 25, 0.75); backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto;
}
.hotbar-slot {
width: 50px; height: 50px; background: rgba(255, 255, 255, 0.04);
border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 10px;
display: flex; flex-direction: column; align-items: center; justify-content: center;
position: relative; cursor: pointer; transition: all 0.15s ease;
}
.hotbar-slot.active {
border-color: #3b82f6; background: rgba(59, 130, 246, 0.15);
box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); transform: translateY(-2px);
}
.hotbar-slot .key {
position: absolute; top: 4px; left: 6px; font-size: 10px; color: rgba(255,255,255,0.5);
}
.hotbar-slot .count {
position: absolute; bottom: 4px; right: 6px; font-size: 11px; font-weight: bold; color: #fff;
}
.hotbar-icon {
width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}
/* Inventory Modal */
#inventory-modal {
position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
width: 480px; background: rgba(18, 18, 24, 0.95); backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 24px;
box-shadow: 0 20px 50px rgba(0,0,0,0.7); opacity: 0; pointer-events: none;
transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; color: #fff;
}
#inventory-modal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
#inventory-modal h2 { margin-bottom: 16px; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.inv-slot {
background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
border-radius: 12px; height: 70px; display: flex; flex-direction: column;
align-items: center; justify-content: center; cursor: pointer; position: relative;
transition: background 0.15s;
}
.inv-slot:hover { background: rgba(255,255,255,0.1); }
.inv-slot .count { position: absolute; bottom: 6px; right: 8px; font-size: 12px; font-weight: 600; }
/* Loading Screen */
#loading-screen {
position: absolute; inset: 0; background: #09090b; z-index: 1000;
display: flex; flex-direction: column; align-items: center; justify-content: center;
gap: 20px; color: #fff; transition: opacity 0.5s ease;
}
#loading-screen h1 { font-size: 28px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(135deg, #3b82f6, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.progress-bar-container { width: 300px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.1s linear; }
/* Instructions Overlay */
#instructions {
position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer;
}
.instruction-card {
background: rgba(20, 20, 26, 0.9); border: 1px solid rgba(255,255,255,0.15);
border-radius: 20px; padding: 30px 40px; text-align: center; color: #fff; max-width: 450px;
box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.instruction-card h2 { margin-bottom: 12px; font-size: 22px; }
.instruction-card p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
.btn {
background: #3b82f6; color: white; border: none; padding: 12px 24px;
font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s, transform 0.1s;
}
.btn:hover { background: #2563eb; transform: translateY(-1px); }
</style>
</head>
<body>
<div id="loading-screen">
<h1>Generating Sphere World...</h1>
<div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
</div>
<div id="instructions">
<div class="instruction-card">
<h2>SphereCraft 3D</h2>
<p>Explore, mine, and build in an infinite procedural world made entirely of spheres.<br><br><b>WASD</b> to move • <b>Space</b> to jump • <b>Left Click</b> to mine • <b>Right Click</b> to place • <b>E</b> for Inventory • <b>C</b> for Creative Fly</p>
<button class="btn" id="start-btn">Click to Play</button>
</div>
</div>
<div id="canvas-container"></div>
<div id="crosshair"></div>
<div id="hud" class="ui-panel">
<div id="fps-counter">FPS: 60</div>
<div id="coords-display">XYZ: 0, 0, 0</div>
<div id="mode-display">Mode: Survival</div>
</div>
<div id="hotbar-container"></div>
<div id="inventory-modal">
<h2>Inventory</h2>
<div class="inventory-grid" id="inventory-grid"></div>
</div>
<!-- CDN Dependencies: Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.body.innerHTML = '<div style="color:white;font-family:sans-serif;padding:40px;text-align:center;"><h1>Failed to load Three.js</h1><p>Check your internet connection or try a different browser.</p></div>';
  throw new Error('THREE is not defined');
}
// --- SIMPLE FAST NOISE GENERATOR (Simplex-like implementation) ---
class SimpleNoise {
constructor() {
this.p = new Uint8Array(512);
const permutation = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,
68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,
143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,
3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,
213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,
104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,
106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
for (let i=0; i<256; i++) { this.p[i] = permutation[i]; this.p[256+i] = permutation[i]; }
}
noise2D(x, y) {
let X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
x -= Math.floor(x); y -= Math.floor(y);
let u = x * x * x * (x * (x * 6 - 15) + 10), v = y * y * y * (y * (y * 6 - 15) + 10);
let A = this.p[X]+Y, B = this.p[X+1]+Y;
// Always pass z=0 so grad never sees undefined
return this.lerp(v, this.lerp(u, this.grad(this.p[A], x, y, 0), this.grad(this.p[B], x, y, 0)),
   this.lerp(u, this.grad(this.p[A+1], x-1, y, 0), this.grad(this.p[B+1], x-1, y, 0))) * 2.3;
}
noise3D(x, y, z) {
let X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
let u = x*x*x*(x*(x*6-15)+10), v = y*y*y*(y*(y*6-15)+10), w = z*z*z*(z*(z*6-15)+10);
let A = this.p[X]+Y, B = this.p[X+1]+Y, AA = this.p[A]+Z, AB = this.p[A+1]+Z, BA = this.p[B]+Z, BB = this.p[B+1]+Z;
return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z), this.grad(this.p[BA], x-1, y, z)),
   this.lerp(u, this.grad(this.p[AB], x, y-1, z), this.grad(this.p[BB], x-1, y-1, z))),
   this.lerp(v, this.lerp(u, this.grad(this.p[AA+1], x, y, z-1), this.grad(this.p[BA+1], x-1, y, z-1)),
   this.lerp(u, this.grad(this.p[AB+1], x, y-1, z-1), this.grad(this.p[BB+1], x-1, y-1, z-1)))) * 2.0;
}
lerp(t, a, b) { return a + t * (b - a); }
grad(hash, x, y, z) {
// z defaults to 0 for 2D safety
z = (z === undefined || z === null) ? 0 : z;
let h = hash & 15;
let u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
}
}
const noiseGen = new SimpleNoise();

// --- GAME CONSTANTS & DEFINITIONS ---
const BLOCK_TYPES = {
AIR: 0,
GRASS: 1,
DIRT: 2,
STONE: 3,
WOOD: 4,
LEAVES: 5,
SAND: 6,
WATER: 7,
GLOWSTONE: 8
};
const BLOCK_CONFIG = {
[BLOCK_TYPES.GRASS]: { name: "Grass", color: 0x55aa33, roughness: 0.9, hardness: 1.0 },
[BLOCK_TYPES.DIRT]: { name: "Dirt", color: 0x8b5a2b, roughness: 1.0, hardness: 0.8 },
[BLOCK_TYPES.STONE]: { name: "Stone", color: 0x7f8c8d, roughness: 0.5, hardness: 2.0 },
[BLOCK_TYPES.WOOD]: { name: "Wood", color: 0x6e4726, roughness: 0.8, hardness: 1.2 },
[BLOCK_TYPES.LEAVES]: { name: "Leaves", color: 0x2e7d32, roughness: 0.9, hardness: 0.4, transparent: true, opacity: 0.85 },
[BLOCK_TYPES.SAND]: { name: "Sand", color: 0xd2b48c, roughness: 0.9, hardness: 0.6 },
[BLOCK_TYPES.WATER]: { name: "Water", color: 0x3388ff, roughness: 0.1, hardness: 0, transparent: true, opacity: 0.6, liquid: true },
[BLOCK_TYPES.GLOWSTONE]: { name: "Glowstone", color: 0xffd700, roughness: 0.2, hardness: 0.5, emissive: 0xffaa00, emissiveIntensity: 1.0 }
};
const HOTBAR_ITEMS = [
BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, BLOCK_TYPES.WOOD,
BLOCK_TYPES.LEAVES, BLOCK_TYPES.SAND, BLOCK_TYPES.WATER, BLOCK_TYPES.GLOWSTONE
];

// --- SETUP SCENE, CAMERA, RENDERER ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcce0ff);
scene.fog = new THREE.FogExp2(0xcce0ff, 0.012);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 30, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

// --- LIGHTING & DAY/NIGHT CYCLE ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3);
hemiLight.position.set(0, 200, 0);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 150, 50);
dirLight.castShadow = true;
dirLight.shadow.camera.top = 80;
dirLight.shadow.camera.bottom = -80;
dirLight.shadow.camera.left = -80;
dirLight.shadow.camera.right = 80;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 400;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

let timeOfDay = 0.3; // 0 to 1 (0.25 is noon, 0.75 is midnight)
function updateLighting(delta) {
timeOfDay = (timeOfDay + delta * 0.015) % 1;
const angle = timeOfDay * Math.PI * 2;
const sunX = Math.cos(angle) * 200;
const sunY = Math.sin(angle) * 200;
dirLight.position.set(sunX, sunY, 50);
const intensity = Math.max(0, Math.sin(angle));
dirLight.intensity = intensity * 1.2;
ambientLight.intensity = 0.2 + intensity * 0.4;
hemiLight.intensity = 0.1 + intensity * 0.3;
// Sky & Fog color shift
let skyColor = new THREE.Color();
if (intensity > 0.25) {
skyColor.setHex(0xcce0ff);
} else if (intensity > 0.0) {
skyColor.setHex(0xd97706); // Sunset/Sunrise
} else {
skyColor.setHex(0x09090b); // Night
}
scene.background.lerp(skyColor, 0.05);
scene.fog.color.copy(scene.background);
}

// --- WORLD & CHUNK MANAGEMENT ---
const CHUNK_SIZE = 16;
const RENDER_DISTANCE = 4; // Chunks radius
const sphereRadius = 0.5;
const modifiedSpheres = JSON.parse(localStorage.getItem('sphereCraft_world') || '{}');

// Shared geometry + materials (NEVER dispose these)
const sphereGeo = new THREE.SphereGeometry(sphereRadius * 0.95, 10, 10);
const materials = {};
function initMaterials() {
for (let id in BLOCK_CONFIG) {
let conf = BLOCK_CONFIG[id];
materials[id] = new THREE.MeshStandardMaterial({
color: conf.color,
roughness: conf.roughness,
transparent: conf.transparent || false,
opacity: conf.opacity || 1.0,
emissive: conf.emissive || 0x000000,
emissiveIntensity: conf.emissiveIntensity || 0
});
}
}
initMaterials();

function getChunkKey(cx, cz) { return `${cx},${cz}`; }

function generateChunkData(cx, cz) {
const chunk = new Map();
const startX = cx * CHUNK_SIZE;
const startZ = cz * CHUNK_SIZE;
const endX = startX + CHUNK_SIZE;
const endZ = startZ + CHUNK_SIZE;

for (let x = 0; x < CHUNK_SIZE; x++) {
for (let z = 0; z < CHUNK_SIZE; z++) {
const worldX = startX + x;
const worldZ = startZ + z;
const heightNoise = noiseGen.noise2D(worldX * 0.03, worldZ * 0.03) * 12 +
noiseGen.noise2D(worldX * 0.1, worldZ * 0.1) * 3;
// Guard against any residual NaN from noise
const surfaceHeight = Math.max(1, Math.min(40, Math.floor(15 + (isNaN(heightNoise) ? 0 : heightNoise))));

for (let y = 0; y <= surfaceHeight + 2; y++) {
let type = BLOCK_TYPES.STONE;
if (y === surfaceHeight) {
type = surfaceHeight < 12 ? BLOCK_TYPES.SAND : BLOCK_TYPES.GRASS;
} else if (y >= surfaceHeight - 3 && y < surfaceHeight) {
type = BLOCK_TYPES.DIRT;
}
// Caves via 3D noise
const cave = noiseGen.noise3D(worldX * 0.1, y * 0.1, worldZ * 0.1);
if (y < surfaceHeight - 2 && cave > 0.45) continue;
chunk.set(`${worldX},${y},${worldZ}`, type);
}

// Water level
for (let y = surfaceHeight + 1; y <= 13; y++) {
if (!chunk.has(`${worldX},${y},${worldZ}`)) {
chunk.set(`${worldX},${y},${worldZ}`, BLOCK_TYPES.WATER);
}
}

// Trees (only place if trunk is safely inside + leaves clamped to this chunk)
if (surfaceHeight >= 13 && noiseGen.noise2D(worldX * 0.5, worldZ * 0.5) > 0.85) {
const treeHeight = 4 + Math.floor(Math.random() * 3);
for (let ty = 1; ty <= treeHeight; ty++) {
chunk.set(`${worldX},${surfaceHeight + ty},${worldZ}`, BLOCK_TYPES.WOOD);
}
// Leaves canopy – only write leaves that belong to this chunk
for (let lx = -2; lx <= 2; lx++) {
for (let ly = -1; ly <= 2; ly++) {
for (let lz = -2; lz <= 2; lz++) {
if (Math.abs(lx) + Math.abs(ly) + Math.abs(lz) > 3) continue;
const leafX = worldX + lx;
const leafY = surfaceHeight + treeHeight + ly;
const leafZ = worldZ + lz;
if (leafX >= startX && leafX < endX && leafZ >= startZ && leafZ < endZ) {
const leafKey = `${leafX},${leafY},${leafZ}`;
if (!chunk.has(leafKey)) {
chunk.set(leafKey, BLOCK_TYPES.LEAVES);
}
}
}
}
}
}
}
}

// Apply saved modifications if any
const cKey = getChunkKey(cx, cz);
if (modifiedSpheres[cKey]) {
for (let pos in modifiedSpheres[cKey]) {
let type = modifiedSpheres[cKey][pos];
if (type === BLOCK_TYPES.AIR) chunk.delete(pos);
else chunk.set(pos, type);
}
}
return chunk;
}

const activeChunks = new Map(); // key -> { group, data, cx, cz }

function updateChunksAroundPlayer(playerX, playerZ) {
const pChunkX = Math.floor(playerX / CHUNK_SIZE);
const pChunkZ = Math.floor(playerZ / CHUNK_SIZE);
const neededChunks = new Set();
for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
neededChunks.add(getChunkKey(pChunkX + x, pChunkZ + z));
}
}

// Unload out-of-range chunks (do NOT dispose shared geometry/materials)
for (let [cKey, chunkObj] of activeChunks) {
if (!neededChunks.has(cKey)) {
scene.remove(chunkObj.group);
// Clear references only – shared sphereGeo / materials stay alive
chunkObj.group = null;
activeChunks.delete(cKey);
}
}

// Load new chunks
neededChunks.forEach(cKey => {
if (!activeChunks.has(cKey)) {
const [cx, cz] = cKey.split(',').map(Number);
const chunkData = generateChunkData(cx, cz);
const chunkGroup = buildChunkMesh(chunkData);
scene.add(chunkGroup);
activeChunks.set(cKey, { group: chunkGroup, data: chunkData, cx, cz });
}
});
}

function buildChunkMesh(chunkData) {
const group = new THREE.Group();
const typeGroups = {};

// Group by block type for InstancedMesh rendering
chunkData.forEach((type, posStr) => {
if (!typeGroups[type]) typeGroups[type] = [];
const [x, y, z] = posStr.split(',').map(Number);
typeGroups[type].push(new THREE.Vector3(x, y, z));
});

const dummy = new THREE.Object3D();
for (let type in typeGroups) {
const positions = typeGroups[type];
const count = positions.length;
if (count === 0) continue;
const mat = materials[type];
const instancedMesh = new THREE.InstancedMesh(sphereGeo, mat, count);
instancedMesh.castShadow = true;
instancedMesh.receiveShadow = true;
instancedMesh.userData.blockType = parseInt(type);

for (let i = 0; i < count; i++) {
dummy.position.copy(positions[i]);
dummy.updateMatrix();
instancedMesh.setMatrixAt(i, dummy.matrix);
}
instancedMesh.instanceMatrix.needsUpdate = true;
group.add(instancedMesh);
}
return group;
}

// --- PLAYER CONTROLS & PHYSICS ---
const player = {
position: new THREE.Vector3(0, 45, 0),
velocity: new THREE.Vector3(0, 0, 0),
radius: 0.35,
height: 1.6,
speed: 6.0,
jumpForce: 8.5,
isGrounded: false,
flying: false
};

const input = { forward: false, backward: false, left: false, right: false, jump: false, sprint: false };
let euler = new THREE.Euler(0, 0, 0, 'YXZ');
let controlsEnabled = false;

window.addEventListener('keydown', (e) => {
if (!controlsEnabled && e.code !== 'KeyE') return;
switch(e.code) {
case 'KeyW': input.forward = true; break;
case 'KeyS': input.backward = true; break;
case 'KeyA': input.left = true; break;
case 'KeyD': input.right = true; break;
case 'Space':
if (player.flying) player.velocity.y = player.speed;
else if (player.isGrounded) { player.velocity.y = player.jumpForce; player.isGrounded = false; }
break;
case 'ShiftLeft':
if (player.flying) player.velocity.y = -player.speed;
else input.sprint = true;
break;
case 'KeyC':
player.flying = !player.flying;
player.velocity.set(0,0,0);
document.getElementById('mode-display').innerText = `Mode: ${player.flying ? 'Creative Fly' : 'Survival'}`;
break;
case 'KeyE': toggleInventory(); break;
case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4':
case 'Digit5': case 'Digit6': case 'Digit7': case 'Digit8':
selectHotbarSlot(parseInt(e.key) - 1); break;
}
});

window.addEventListener('keyup', (e) => {
switch(e.code) {
case 'KeyW': input.forward = false; break;
case 'KeyS': input.backward = false; break;
case 'KeyA': input.left = false; break;
case 'KeyD': input.right = false; break;
case 'ShiftLeft': input.sprint = false; break;
}
});

const startBtn = document.getElementById('start-btn');
const instructions = document.getElementById('instructions');
startBtn.addEventListener('click', () => {
document.body.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
controlsEnabled = document.pointerLockElement === document.body;
instructions.style.display = controlsEnabled ? 'none' : 'flex';
});
document.addEventListener('mousemove', (e) => {
if (!controlsEnabled) return;
const movementX = e.movementX || 0;
const movementY = e.movementY || 0;
euler.y -= movementX * 0.002;
euler.x -= movementY * 0.002;
euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
camera.quaternion.setFromEuler(euler);
});

// Voxel World Query Helper
function getBlockAt(x, y, z) {
const cx = Math.floor(x / CHUNK_SIZE);
const cz = Math.floor(z / CHUNK_SIZE);
const cKey = getChunkKey(cx, cz);
const chunk = activeChunks.get(cKey);
if (!chunk) return BLOCK_TYPES.AIR;
return chunk.data.get(`${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`) || BLOCK_TYPES.AIR;
}

function setBlockAt(x, y, z, type) {
const bx = Math.floor(x), by = Math.floor(y), bz = Math.floor(z);
const cx = Math.floor(bx / CHUNK_SIZE);
const cz = Math.floor(bz / CHUNK_SIZE);
const cKey = getChunkKey(cx, cz);
const chunk = activeChunks.get(cKey);
if (!chunk) return;

const posStr = `${bx},${by},${bz}`;
const oldType = chunk.data.get(posStr) || BLOCK_TYPES.AIR;

if (type === BLOCK_TYPES.AIR) {
chunk.data.delete(posStr);
// Give the mined block back to the player (survival)
if (oldType !== BLOCK_TYPES.AIR && !player.flying && inventory[oldType] !== undefined) {
inventory[oldType] = (inventory[oldType] || 0) + 1;
updateHotbarCounts();
}
} else {
chunk.data.set(posStr, type);
}

// Persist modification
if (!modifiedSpheres[cKey]) modifiedSpheres[cKey] = {};
modifiedSpheres[cKey][posStr] = type;
try {
localStorage.setItem('sphereCraft_world', JSON.stringify(modifiedSpheres));
} catch (e) { /* storage full or disabled – ignore */ }

// Rebuild only this chunk (shared geometry stays untouched)
scene.remove(chunk.group);
chunk.group = buildChunkMesh(chunk.data);
scene.add(chunk.group);
}

// --- INVENTORY & HOTBAR ---
const inventory = {
[BLOCK_TYPES.GRASS]: 64,
[BLOCK_TYPES.DIRT]: 64,
[BLOCK_TYPES.STONE]: 64,
[BLOCK_TYPES.WOOD]: 64,
[BLOCK_TYPES.LEAVES]: 64,
[BLOCK_TYPES.SAND]: 64,
[BLOCK_TYPES.WATER]: 64,
[BLOCK_TYPES.GLOWSTONE]: 64
};
let activeSlotIndex = 0;
let inventoryOpen = false;

function initUI() {
const hotbarContainer = document.getElementById('hotbar-container');
hotbarContainer.innerHTML = '';
HOTBAR_ITEMS.forEach((type, idx) => {
const slot = document.createElement('div');
slot.className = `hotbar-slot ${idx === activeSlotIndex ? 'active' : ''}`;
const colorHex = BLOCK_CONFIG[type].color.toString(16).padStart(6, '0');
slot.innerHTML = `<span class="key">${idx + 1}</span><div class="hotbar-icon" style="background:#${colorHex}"></div><span class="count" id="hotbar-count-${idx}">${inventory[type] || 0}</span>`;
slot.onclick = () => selectHotbarSlot(idx);
hotbarContainer.appendChild(slot);
});

const invGrid = document.getElementById('inventory-grid');
invGrid.innerHTML = '';
Object.keys(BLOCK_CONFIG).forEach(typeKey => {
const type = parseInt(typeKey);
const slot = document.createElement('div');
slot.className = 'inv-slot';
const colorHex = BLOCK_CONFIG[type].color.toString(16).padStart(6, '0');
slot.innerHTML = `<div class="hotbar-icon" style="background:#${colorHex}; width:28px; height:28px; margin-bottom:4px;"></div><span style="font-size:11px">${BLOCK_CONFIG[type].name}</span><span class="count">${inventory[type] || 0}</span>`;
invGrid.appendChild(slot);
});
}

function updateHotbarCounts() {
HOTBAR_ITEMS.forEach((type, idx) => {
const el = document.getElementById(`hotbar-count-${idx}`);
if (el) el.innerText = inventory[type] || 0;
});
}

function selectHotbarSlot(idx) {
activeSlotIndex = idx;
document.querySelectorAll('.hotbar-slot').forEach((s, i) => {
s.classList.toggle('active', i === idx);
});
}

function toggleInventory() {
inventoryOpen = !inventoryOpen;
const modal = document.getElementById('inventory-modal');
modal.classList.toggle('open', inventoryOpen);
if (inventoryOpen) {
document.exitPointerLock();
} else if (controlsEnabled) {
document.body.requestPointerLock();
}
}

// --- INTERACTION (MINING & PLACING) ---
const raycaster = new THREE.Raycaster();
const _matrix = new THREE.Matrix4();
const _center = new THREE.Vector3();
const _dir = new THREE.Vector3();

window.addEventListener('mousedown', (e) => {
if (!controlsEnabled || inventoryOpen) return;
raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

// Collect only currently active meshes
const intersectMeshes = [];
activeChunks.forEach(chunk => {
if (chunk.group) {
chunk.group.traverse(child => { if (child.isMesh) intersectMeshes.push(child); });
}
});

const intersects = raycaster.intersectObjects(intersectMeshes, false);
if (intersects.length === 0) return;

const hit = intersects[0];
if (hit.distance > 8) return;

const instanceId = hit.instanceId;
const mesh = hit.object;
if (instanceId === undefined) return;

mesh.getMatrixAt(instanceId, _matrix);
_center.setFromMatrixPosition(_matrix);

if (e.button === 0) {
// Left Click: Mine / Destroy
setBlockAt(_center.x, _center.y, _center.z, BLOCK_TYPES.AIR);
} else if (e.button === 2) {
// Right Click: Place adjacent (snap normal to nearest axis because spheres are round)
_dir.copy(hit.point).sub(_center).normalize();
const ax = Math.abs(_dir.x), ay = Math.abs(_dir.y), az = Math.abs(_dir.z);
let nx = 0, ny = 0, nz = 0;
if (ax >= ay && ax >= az) nx = Math.sign(_dir.x);
else if (ay >= az) ny = Math.sign(_dir.y);
else nz = Math.sign(_dir.z);

const placeX = Math.round(_center.x + nx);
const placeY = Math.round(_center.y + ny);
const placeZ = Math.round(_center.z + nz);

// Don't place inside the player
const dx = placeX - player.position.x;
const dy = placeY - (player.position.y - 0.8);
const dz = placeZ - player.position.z;
if (Math.abs(dx) < 0.9 && Math.abs(dy) < 1.4 && Math.abs(dz) < 0.9) return;

const activeType = HOTBAR_ITEMS[activeSlotIndex];
if (inventory[activeType] > 0 || player.flying) {
setBlockAt(placeX, placeY, placeZ, activeType);
if (!player.flying) {
inventory[activeType]--;
updateHotbarCounts();
}
}
}
});

// Prevent context menu on right click
window.addEventListener('contextmenu', e => e.preventDefault());

// --- GAME LOOP & PHYSICS UPDATE ---
let clock = new THREE.Clock();
let frameCount = 0, lastTime = performance.now(), fps = 60;

function updatePlayer(delta) {
if (player.flying) {
const speed = player.speed * (input.sprint ? 2.5 : 1.5);
const dir = new THREE.Vector3();
camera.getWorldDirection(dir);
const sideDir = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
let moveDir = new THREE.Vector3();
if (input.forward) moveDir.add(dir);
if (input.backward) moveDir.sub(dir);
if (input.right) moveDir.add(sideDir);
if (input.left) moveDir.sub(sideDir);
if (moveDir.lengthSq() > 0) moveDir.normalize();
player.position.addScaledVector(moveDir, speed * delta);
player.position.y += player.velocity.y * delta;
player.velocity.y *= 0.85;
camera.position.copy(player.position);
return;
}

// Gravity
player.velocity.y -= 25.0 * delta;
const speed = player.speed * (input.sprint ? 1.6 : 1.0);
const dir = new THREE.Vector3();
camera.getWorldDirection(dir);
dir.y = 0;
if (dir.lengthSq() > 0) dir.normalize();
const sideDir = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

let moveDir = new THREE.Vector3();
if (input.forward) moveDir.add(dir);
if (input.backward) moveDir.sub(dir);
if (input.right) moveDir.add(sideDir);
if (input.left) moveDir.sub(sideDir);
if (moveDir.lengthSq() > 0) moveDir.normalize();

player.velocity.x = moveDir.x * speed;
player.velocity.z = moveDir.z * speed;

// Simple axis-separated collision
const tryMove = (axis, amount) => {
player.position[axis] += amount;
const checkYLow = player.position.y - 1.4;
const checkYHigh = player.position.y - 0.2;
if (getBlockAt(player.position.x, checkYLow, player.position.z) !== BLOCK_TYPES.AIR ||
getBlockAt(player.position.x, checkYHigh, player.position.z) !== BLOCK_TYPES.AIR) {
player.position[axis] -= amount;
return false;
}
return true;
};

tryMove('x', player.velocity.x * delta);
tryMove('z', player.velocity.z * delta);

player.position.y += player.velocity.y * delta;

if (player.velocity.y < 0) {
// Landing
if (getBlockAt(player.position.x, player.position.y - 1.55, player.position.z) !== BLOCK_TYPES.AIR) {
player.position.y = Math.floor(player.position.y - 1.55) + 1.55 + 0.5;
player.velocity.y = 0;
player.isGrounded = true;
} else {
player.isGrounded = false;
}
} else if (player.velocity.y > 0) {
// Ceiling
if (getBlockAt(player.position.x, player.position.y + 0.15, player.position.z) !== BLOCK_TYPES.AIR) {
player.velocity.y = 0;
}
}

camera.position.copy(player.position);
}

// --- INITIALIZATION & LOADING ---
function initWorld() {
const progressBar = document.getElementById('progress-bar');
const loadRadius = 3;
const totalChunks = (loadRadius * 2 + 1) * (loadRadius * 2 + 1);
let loaded = 0;

for (let x = -loadRadius; x <= loadRadius; x++) {
for (let z = -loadRadius; z <= loadRadius; z++) {
const cKey = getChunkKey(x, z);
const chunkData = generateChunkData(x, z);
const chunkGroup = buildChunkMesh(chunkData);
scene.add(chunkGroup);
activeChunks.set(cKey, { group: chunkGroup, data: chunkData, cx: x, cz: z });
loaded++;
progressBar.style.width = `${(loaded / totalChunks) * 100}%`;
}
}

// Find safe ground level near origin
let found = false;
for (let y = 40; y >= 0; y--) {
if (getBlockAt(0, y, 0) !== BLOCK_TYPES.AIR) {
player.position.set(0.5, y + 2.2, 0.5);
found = true;
break;
}
}
if (!found) player.position.set(0.5, 25, 0.5);

camera.position.copy(player.position);
initUI();

setTimeout(() => {
const ls = document.getElementById('loading-screen');
ls.style.opacity = '0';
setTimeout(() => ls.remove(), 500);
}, 400);
}

initWorld();

// --- MAIN ANIMATION LOOP ---
function animate() {
requestAnimationFrame(animate);
const delta = Math.min(clock.getDelta(), 0.1);

if (controlsEnabled) {
updatePlayer(delta);
updateChunksAroundPlayer(player.position.x, player.position.z);
}

updateLighting(delta);
renderer.render(scene, camera);

// FPS & HUD
frameCount++;
const time = performance.now();
if (time - lastTime >= 1000) {
fps = Math.round((frameCount * 1000) / (time - lastTime));
document.getElementById('fps-counter').innerText = `FPS: ${fps}`;
frameCount = 0;
lastTime = time;
}
document.getElementById('coords-display').innerText =
`XYZ: ${Math.floor(player.position.x)}, ${Math.floor(player.position.y)}, ${Math.floor(player.position.z)}`;
}
animate();

// Handle Window Resize
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
